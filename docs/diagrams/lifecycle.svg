<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="100%" role="img">
  <style>.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A}.node{}.c-gray{fill:#F1EFE8}.c-amber{fill:#FAEEDA}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}</style>
  <title>一次请求的生命周期</title>
  <desc>从用户唤醒到回复返回的纵向流程：幕僚长作为唯一枢纽，路由到 persona，再选大脑，可选调工具/记忆，生成回复经安全闸后写回记忆并返回用户。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">一次请求的生命周期</text>

  <g><rect x="220" y="56" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="340" y="74" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">用户</text><text x="340" y="90" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">唤醒 / 输入</text></g>
  <g><rect x="220" y="118" width="240" height="46" rx="8" fill="#FAEEDA" stroke="#B4B2A9" stroke-width="0.5"/><text x="340" y="136" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">幕僚长</text><text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">单入口 / 统筹</text></g>
  <g><rect x="220" y="180" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">意图路由</text><text x="340" y="214" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">关键词 → 角色</text></g>
  <g><rect x="220" y="242" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">persona</text><text x="340" y="276" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">律师 / 编程 / 新媒体</text></g>
  <g><rect x="220" y="304" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="340" y="322" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">选大脑 Brain</text><text x="340" y="338" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">local / general / coding</text></g>
  <g><rect x="220" y="366" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="340" y="384" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">工具 / 记忆</text><text x="340" y="400" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">可选 · 按需调用</text></g>
  <g><rect x="220" y="428" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="340" y="446" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">生成回复</text><text x="340" y="462" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">经 guard 安全闸</text></g>
  <g><rect x="220" y="490" width="240" height="46" rx="8" fill="#FAEEDA" stroke="#B4B2A9" stroke-width="0.5"/><text x="340" y="508" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">写黑板·记忆</text><text x="340" y="524" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">→ 回用户</text></g>

  <line x1="340" y1="102" x2="340" y2="118" stroke="#5F5E5A" stroke-width="1.5"/>
  <line x1="340" y1="164" x2="340" y2="180" stroke="#5F5E5A" stroke-width="1.5"/>
  <line x1="340" y1="226" x2="340" y2="242" stroke="#5F5E5A" stroke-width="1.5"/>
  <line x1="340" y1="288" x2="340" y2="304" stroke="#5F5E5A" stroke-width="1.5"/>
  <line x1="340" y1="350" x2="340" y2="366" stroke="#5F5E5A" stroke-width="1.5"/>
  <line x1="340" y1="412" x2="340" y2="428" stroke="#5F5E5A" stroke-width="1.5"/>
  <line x1="340" y1="474" x2="340" y2="490" stroke="#5F5E5A" stroke-width="1.5"/>

  <text x="340" y="558" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">幕僚长是唯一枢纽 · persona 是路由结果 · 工具/记忆可选</text>
</svg>