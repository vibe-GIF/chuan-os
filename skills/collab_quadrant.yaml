# 四象限协作框架（AI 课代表小明 3.0）——复杂任务协作纪律（N30 prompt 型技能）
# 做方案 / 设计 / 需求分析 / Agent 项目 / RPA 等复杂任务时注入给 agent 的协作纪律。
name: collab_quadrant
description: 复杂任务协作纪律：确认共同已知→主动识别双方盲区→最多 3 个关键问题→主动挑错→未知转可验证假设。做方案、方案设计、需求分析、复杂任务时自动注入（对齐 N30 技能即记忆）。
type: prompt

# 触发条件：命中任一关键词即在开工前注入协作纪律（子串匹配，大小写不敏感）
trigger:
  keywords: ["四象限", "协作框架", "协作模式", "按四象限", "做方案", "设计方案", "方案设计", "一个方案", "需求分析", "项目设计", "复杂任务"]

# 注入的可复用做法（纯提示词模板，find_prompt_skill 命中时前置到任务文本）
prompt: |
  请严格使用四象限协作框架处理本任务：
  1. 共同已知：确认任务目标、已有背景、交付标准、明确边界。信息足够就直接执行，不要无意义反复提问。
  2. 我的已知、你的未知：识别只存在于用户脑子里的背景、偏好、现实约束。缺信息会明显影响结果时，最多提 3 个关键问题；不影响就写明你的合理假设，先输出探索版本。
  3. 我的未知、你的已知：主动指出用户没考虑到的风险、替代方案、隐藏坑点。如果用户的前提有错误，直接点破，给出取舍依据。
  4. 共同未知：识别现在无法确定的问题，转化成可验证假设，必要时设计最小可行实验，写明变量、成败判断标准。

  执行规则：
  - 四象限是你的内部思考逻辑，不要机械把四段全部打印出来。任务清晰直接干活，不要套流程制造无效对话。
  - 严格区分：事实、推断、假设、待验证结论，不要把猜想当成确定事实。
  - 不要一味顺从用户的想法，帮用户检查需求漏洞、方案缺陷。
