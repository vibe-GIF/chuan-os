# 视觉理解（N50，N52 扩展 PDF/表格/录屏视频转图分析）
name: vision_analyze
description: 视觉理解：分析本地图片、图片 URL、PDF、表格(csv)、录屏视频首帧，返回内容描述（识别物体 / 文字 OCR / 场景 / 布局 / 图表）。看图片、看 PDF、读表格、看视频、分析截图、识别图中文字时用。
type: handler

# 触发条件
trigger:
  keywords: ["看图", "识别图片", "图片内容", "这张图", "截图分析", "图片里", "图里有什么", "图片中", "看 PDF", "看pdf", "读表格", "看表格", "视频截图", "看视频", "分析这个文件"]

# 调用的本地 handler（读 config brains.vision 视觉模型，key 复用百炼）
handler:
  module: handlers.vision_analyze
  function: vision_analyze

# 参数映射
params:
  image_ref:
    from: user_input
    required: false